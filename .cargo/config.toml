# Builds against the Termexo checkout sitting next to this one.
#
# `termexo-relay-protocol` is declared in Cargo.toml as a git dependency on the Termexo repository,
# which owns it: the desktop app compiles the same crate and builds entirely from its own checkout.
# Developing the two together would otherwise mean pushing Termexo after every protocol change, so a
# sibling checkout takes precedence here.
#
# Delete this file to build purely from the published git revision — that is what the Dockerfile and
# any standalone clone do.
[patch."https://github.com/gemron/Termexo.git"]
termexo-relay-protocol = { path = "../Termexo/crates/termexo-relay-protocol" }
